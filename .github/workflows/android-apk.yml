name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests execute repository-controlled Flutter/Gradle code, so this
  # validation job is deliberately secret-free. Release signing, OAuth config,
  # and publication are available only to the trusted release job below.
  validate-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug

  build-apk:
    # Only trusted pushes and manually dispatched runs from main/version tags
    # may reach the release-signing and publication steps. PRs use validate-pr.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    env:
      # upload-artifact@v5 still declares Node 20; force the Node 24 runtime so
      # the deprecation warning goes away (per GitHub's guidance).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^version:' mobile/pubspec.yaml | sed -E 's/version:[[:space:]]*//' | cut -d'+' -f1)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: ${VERSION}"

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      # Decode the fixed release keystore from secrets so every trusted build is
      # signed with the same key (stable SHA-1 for Google Sign-In + cross-version
      # OTA updates). Secrets are scoped to this trusted job's signing step.
      - name: Check release signing availability
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure release signing
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.jks
          cat > key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: mobile
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: >-
          flutter build apk --release
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ github.run_number }}
          --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Check S3 publication configuration
        id: s3
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          if [[ -n "$S3_ENDPOINT" && -n "$S3_BUCKET" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Only needed as a fallback when S3 isn't configured — the APK is normally
      # distributed via S3 below. Skipping it on configured runs also avoids the
      # upload-artifact@v5 Node 20 deprecation warning (no Node 24 release yet).
      - name: Upload APK artifact
        if: ${{ steps.s3.outputs.enabled != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-food-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to S3
        if: ${{ steps.s3.outputs.enabled == 'true' }}
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          APK_PATH: mobile/build/app/outputs/flutter-apk/app-release.apk
          RELEASE_NAME: ${{ steps.version.outputs.version }}
        run: |
          aws s3 cp "$APK_PATH" "s3://$S3_BUCKET/downloads/ai-food-v$RELEASE_NAME.apk" --endpoint-url "$S3_ENDPOINT"
          aws s3 cp "$APK_PATH" "s3://$S3_BUCKET/downloads/ai-food-latest.apk" --endpoint-url "$S3_ENDPOINT"
