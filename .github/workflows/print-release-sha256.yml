name: Print Release SHA-256 (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print-fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore and print SHA-256
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          keytool -list -v -keystore release.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E "SHA256:|SHA1:|Owner:"
          rm -f release.jks
