name: Prisma Migration Smoke Test

on:
  pull_request:
    branches: ["main"]
    paths:
      - "prisma/**"
      - "prisma.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/prisma-migration-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "prisma/**"
      - "prisma.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/prisma-migration-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-from-empty:
    name: Migrate and test disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: food_diary_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d food_diary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/food_diary_test
      FOOD_TEST_DATABASE_URL: postgresql://user:password@127.0.0.1:5432/food_diary_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply all committed migrations to empty PostgreSQL
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Run personal data export integration tests
        run: npm run test:data-export
