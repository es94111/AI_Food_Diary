name: Prisma Migration Smoke Test

on:
  pull_request:
    branches: ["main"]
    paths:
      - "prisma/**"
      - "prisma.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/prisma-migration-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "prisma/**"
      - "prisma.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/prisma-migration-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-from-empty:
    name: Migrate empty PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ai_food_diary
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d ai_food_diary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/ai_food_diary

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply all committed migrations to empty PostgreSQL
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status
