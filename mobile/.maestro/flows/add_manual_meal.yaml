appId: aifood.shao.one
name: "Add a meal via manual entry, then delete it (keeps the test account clean)"
tags:
  - smoke
env:
  MEAL_NAME: "Maestro 測試餐點"
---
- launchApp:
    clearState: true
- runFlow: login.yaml

# Capture starts from the primary mobile action and continues in a focused page.
- tapOn: "記錄飲食"
- tapOn: "手動記錄"

- tapOn: "食物名稱"
- inputText: ${MEAL_NAME}
- tapOn: "熱量 kcal"
- inputText: "120"
- hideKeyboard

- scrollUntilVisible:
    element: "開始分析"
    direction: DOWN
- tapOn: "開始分析"

# Manual mode still round-trips through the backend, so give it real time.
- extendedWaitUntil:
    visible: "查看草稿"
    timeout: 60000
- tapOn: "查看草稿"

- scrollUntilVisible:
    element: "確認並儲存"
    direction: DOWN
- tapOn: "確認並儲存"

- extendedWaitUntil:
    visible: ".*${MEAL_NAME}.*"
    timeout: 20000
- scrollUntilVisible:
    element: ".*${MEAL_NAME}.*"
    direction: DOWN

# Clean up so the test account's diary doesn't accumulate junk on every run.
- tapOn:
    text: "刪除"
    below: ".*${MEAL_NAME}.*"
- tapOn: "刪除"
- assertNotVisible: ".*${MEAL_NAME}.*"

- runFlow: logout.yaml
