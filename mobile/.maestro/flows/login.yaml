# Reusable Google SSO login subflow — run via `runFlow: login.yaml` from a
# parent flow that has already launched the app onto the login screen.
#
# The test device must have a dedicated Google test account configured and the
# backend/client Google OAuth settings must be available. Native Google account
# selection and consent screens can vary by emulator, so this flow is a smoke
# check rather than a substitute for provider integration tests.
appId: aifood.shao.one
---
- tapOn: "使用 Google 登入"
- extendedWaitUntil:
      visible: "AI Food Diary.*"
      timeout: 30000
