<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#b45309">
    <title>目前離線 · AI Food Diary</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; background: #f7f2e9; color: #292320; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 480px); padding: 32px; border: 1px solid #e4ddd3; border-radius: 24px; background: #fffdf9; box-shadow: 0 18px 50px #29232012; }
      .mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 14px 14px 14px 4px; background: #f4bd55; font-size: 24px; }
      h1 { margin: 24px 0 8px; font-size: 1.65rem; }
      p { color: #756d64; line-height: 1.7; }
      a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 12px; background: #b45309; color: white; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">🍽</span>
      <h1>目前離線</h1>
      <p>此頁需要網路連線。服務恢復後即可重新載入；已輸入的餐點文字草稿會保存在此瀏覽器。</p>
      <p>為保護隱私，離線時不會顯示先前帳號的餐點或其他雲端資料。</p>
      <a href="/dashboard">重新載入</a>
    </main>
  </body>
</html>
